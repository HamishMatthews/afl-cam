# afl-cam: cap the pipeline logs (a wedged process wrote 400MB in a
# weekend before the watchdogs + filters — never again unbounded).
/home/hamish/Documents/afl-cam/outputs/_live/*.log {
    size 10M
    rotate 2
    copytruncate
    compress
    missingok
    notifempty
}

# per-session recorder logs (the GTK-UI path writes <session>/*.rec.log;
# rkvenc's benign refcount noise can reach ~100MB per game)
/home/hamish/Documents/afl-cam/outputs/*/*.rec.log {
    size 50M
    rotate 1
    copytruncate
    compress
    missingok
    notifempty
}
