# afl-cam field AP — hostapd config (bcmdhd needs hostapd: NM/wpa_supplicant
# AP mode hangs on this driver, verified 2026-10-09).
# Installed by scripts/install_field_services.sh to /etc/hostapd/afl-cam.conf.
interface=wlan0
driver=nl80211
ssid=afl-cam
hw_mode=g
channel=6
wpa=2
wpa_passphrase=aflcam2026
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
country_code=AU
