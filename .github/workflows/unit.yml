# Hardware-free tests (tests/unit): run on GitHub's own runners on every PR,
# in seconds, no board needed. The rig suite stays in rig-test.yml.
name: unit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: uv sync
      - run: uv run pytest tests/unit -v
