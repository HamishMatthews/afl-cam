# TEMP: investigation probes for #55 on the rig (removed before any PR)
name: probe
on:
  push:
    branches: [recording-stability-image-nf0rbx]
    paths: ["probe/**", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: [self-hosted, afl-cam-rig]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: bash probe/run.sh "$GITHUB_WORKSPACE"
      - name: Push probe output to the probe-out branch
        if: always()
        run: |
          cd probe-out 2>/dev/null || exit 0
          git init -q -b probe-out . && git add -A
          git -c "user.name=Hamish Matthews" -c user.email=47095925+HamishMatthews@users.noreply.github.com commit -qm "probe ${GITHUB_SHA::7} $(cat ../probe/EXP)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out:probe-out
