[project]
name = "afl-cam"
version = "0.1.0"
description = "Portable dual-camera recording and panoramic stitching for amateur AFL football"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]

[project.scripts]
afl-cam = "afl_cam.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["afl_cam"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# The VFR mux (afl_cam/retime.py) is PyAV, so the fixtures in the unit suite
# need it. Deliberately NOT in `dev`: the board's project venv is Python
# 3.14, av 13 (the version the board's own PyAV venv proves — av 18
# segfaults in add_stream) has no cp314 wheels, and a `uv sync` the rig
# cannot complete takes the whole rig suite down with it. CI installs this
# group; the field daemon never installs PyAV at all, it shells out to the
# board venv at AFL_CAM_RETIME_PY.
mux = [
    "av>=13,<14",
]

[tool.pytest.ini_options]
markers = [
    "slow: record cycle and other multi-minute tests",
]
testpaths = ["tests"]
