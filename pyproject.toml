[project]
name = "afl-cam"
version = "0.1.0"
description = "Portable dual-camera recording and panoramic stitching for amateur AFL football"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
]

[project.scripts]
afl-cam = "afl_cam.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["afl_cam"]
